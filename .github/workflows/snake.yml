name: Generate contribution snake

on:
  schedule:
    - cron: "7,37 * * * *"    # every 30 minutes, so new contributions show up quickly
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]           # also runs whenever you update this repo

permissions:
  contents: write

concurrency:                   # if a newer run starts, cancel the older one
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from your contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
